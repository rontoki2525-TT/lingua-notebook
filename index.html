id-template-columns:1fr;margin-top:22px}.auth-route .modal-foot button{width:100%;padding:12px}.auth-route .auth-note{text-align:left;margin:8px 0 22px}.auth-route .field{margin:16px 0}.auth-route .field label{font-size:12px}.auth-route .field input{padding:13px 14px;border-radius:10px}.auth-route .auth-switch{margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#29372d;color:white;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}

<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="logo">L</div><div>lingua<small>YOUR ENGLISH NOTEBOOK</small></div></div><div class="top-actions"><span id="cloudStatus" class="cloud-status">ローカル保存</span><button class="button" id="authBtn">ログイン</button><button class="button" id="migrateBtn" hidden>クラウドへ移行</button><button class="button" id="themeBtn" aria-label="ダークモードに切り替え">☾ ダーク</button><button class="button" id="exportBtn">↗ 書き出し</button><button class="button primary" id="addBtn">＋ 新しい単語</button></div></header>
    <main>
      <section class="hero"><div><div class="eyebrow">YOUR ENGLISH NOTEBOOK</div><h1>今日も、ひとつずつ。</h1><p>覚えたい英語を、あなたのペースで。</p></div></section>
      <div class="mode-tabs"><button class="mode-tab active" data-mode="list">一覧モード</button><button class="mode-tab" data-mode="review">復習モード</button></div>
      <div class="voice-setting"><label for="voiceSelect">英語の音声</label><select id="voiceSelect" aria-label="英語の音声"><option value="">音声を読み込み中...</option></select><button type="button" id="favoriteVoiceBtn" title="選択中の音声をお気に入りに登録">☆ 音声をお気に入り</button></div>
      <section class="dictionary" aria-labelledby="dictionaryTitle"><div class="dictionary-head"><h2 id="dictionaryTitle">英語辞書</h2><p>英英の意味・品詞・例文と日本語訳を調べます</p></div><form id="dictionaryForm" class="dictionary-form"><input id="dictionaryQuery" type="search" placeholder="英単語を入力（例: handy）" aria-label="辞書で調べる英単語" required><button class="button primary" type="submit">辞書で調べる</button></form><div id="dictionaryTranslation" class="dictionary-results" aria-live="polite"></div><div id="dictionaryResults" class="dictionary-results" aria-live="polite"></div></section>
      <div class="library-toolbar"><section class="stats"><div class="stat"><span>表現数</span><strong id="totalCount">0</strong></div></section><div class="search"><input id="search" placeholder="単語や意味を検索..." aria-label="検索"></div><select id="filter"><option value="all">すべての単語</option><option value="due">復習する単語</option></select><button class="button" id="shuffleBtn">⤨ ランダム復習</button></div>
      <div id="reviewStatus" class="review-status" aria-live="polite"><span id="reviewProgress"></span><div class="review-speed"><label for="speedRange">読み上げ速度</label><input id="speedRange" type="range" min="0.6" max="1.4" step="0.1" value="0.9"><output id="speedValue" for="speedRange">0.9x</output><button type="button" class="auto-toggle" id="autoToggle">▶ 自動読み上げ開始</button></div></div><div class="subtoolbar"><span id="resultCount">0件の表現</span><div class="quick"><button class="text-btn" id="showAll">すべて表示</button><button class="text-btn" id="hideAll">すべて隠す</button></div></div>
      <section id="list" class="list"></section>
    </main>
  </div>
  <div class="overlay" id="authOverlay"><form class="modal" id="authForm"><div class="auth-brand"><div class="logo">L</div><div>lingua<small>YOUR ENGLISH NOTEBOOK</small></div></div><div class="modal-top"><h2 id="authTitle">ログイン</h2><button type="button" class="close" id="authClose" aria-label="閉じる">×</button></div><p class="auth-note" id="authNote">クラウドに保存した学習データを使うにはログインしてください。</p><div class="field"><label for="authEmail">ID（登録したメールアドレス）</label><input id="authEmail" type="email" placeholder="name@example.com" required autocomplete="username"></div><div class="field"><label for="authPassword">パスワード</label><input id="authPassword" type="password" placeholder="8文字以上" required minlength="8" autocomplete="current-password"></div><div class="modal-foot"><button type="button" class="button" id="signupBtn">新規登録</button><button type="submit" class="button primary" id="loginBtn">ログイン</button></div><p class="auth-switch"><span id="authSwitchText">アカウントをお持ちでない場合</span> <a id="authSwitchLink" href="?auth=signup">新規登録</a></p></form></div>
  <div class="overlay" id="overlay"><form class="modal" id="entryForm"><div class="modal-top"><h2 id="modalTitle">新しい単語</h2><button type="button" class="close" id="closeModal">×</button></div><input type="hidden" id="entryId"><div class="field"><label for="termInput">表現・単語 *</label><input id="termInput" required placeholder="e.g. figure out"><button type="button" class="speak-btn" id="previewSpeak">🔊 発音を試す</button></div><div class="field"><label for="meaningInput">意味 *</label><textarea id="meaningInput" required placeholder="意味やニュアンス"></textarea></div><div class="field"><label for="exampleEnInput">例文（英語）</label><textarea id="exampleEnInput" placeholder="Write an example sentence in English"></textarea><button type="button" class="speak-btn" id="previewExampleSpeak">🔊 例文を試聴</button></div><div class="field"><label for="exampleJaInput">例文（日本語）</label><textarea id="exampleJaInput" placeholder="例文の日本語訳"></textarea></div><div class="field"><label for="noteEnInput">My note（英語）</label><textarea id="noteEnInput" placeholder="Write your own sentence in English"></textarea></div><div class="field"><label for="noteJaInput">My note（日本語）</label><textarea id="noteJaInput" placeholder="自分の例文・気づきの日本語訳"></textarea></div><div class="modal-foot"><button type="button" class="button" id="cancelBtn">キャンセル</button><button class="button primary" type="submit">保存する</button></div></form></div><div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const KEY='lingua-english-notebook-v1',LEGACY_KEY='lingua-english-notebook-before-cloud-v1';
    const SUPABASE_URL='https://plhfxcscvqwowqhlfcla.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_RCm1aiRHN4cnoVtEJxRs2w_hQYHg4i0';
    const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const seed=[
      {id:'seed1',term:'figure out',meaning:'理解する、解決する（考えたり調べたりして答えを見つける）',exampleEn:'I finally figured out how to use the new app.',exampleJa:'新しいアプリの使い方がやっとわかった。',noteEn:'I need to figure out what to cook for dinner.',noteJa:'',created:Date.now(),lastReview:null,nextReview:null},
      {id:'seed2',term:'come in handy',meaning:'役に立つ、重宝する',exampleEn:'This little notebook will come in handy during my trip.',exampleJa:'この小さなノートは旅行中に役立つだろう。',noteEn:'Your advice came in handy when I talked to my manager.',noteJa:'',created:Date.now(),lastReview:null,nextReview:null},
      {id:'seed3',term:'take your time',meaning:'ゆっくりでいいよ、時間をかけて',exampleEn:'Take your time. There is no rush.',exampleJa:'ゆっくりでいいよ。急がなくて大丈夫。',noteEn:'',noteJa:'',created:Date.now(),lastReview:null,nextReview:null}
    ];
    let entries;try{entries=JSON.parse(localStorage.getItem(KEY))}catch{entries=null} if(!Array.isArray(entries)){entries=seed;localStorage.setItem(KEY,JSON.stringify(seed))}
    try{if(!localStorage.getItem(LEGACY_KEY))localStorage.setItem(LEGACY_KEY,JSON.stringify(entries))}catch{}
    const $=s=>document.querySelector(s), list=$('#list'); let expanded=new Set(),mode='list',reviewOrder=[],reviewIndex=0,reviewActive=false,autoReview=false,autoTimer=null,englishVoices=[],currentUser=null,cloudBusy=false;
    function normalize(e){if(e.exampleEn===undefined&&e.example){const [en,...ja]=String(e.example).split('\n');e.exampleEn=en;e.exampleJa=ja.join('\n')}if(e.noteEn===undefined){e.noteEn=e.note||'';e.noteJa=''}e.exampleEn=e.exampleEn||'';e.exampleJa=e.exampleJa||'';e.noteEn=e.noteEn||'';e.noteJa=e.noteJa||'';e.reviewCount=Number(e.reviewCount)||0;return e}entries=entries.map(normalize);
    function dbRow(e){return{id:e.id,user_id:currentUser.id,term:e.term,meaning:e.meaning||'',example_en:e.exampleEn||'',example_ja:e.exampleJa||'',note_en:e.noteEn||'',note_ja:e.noteJa||'',review_count:Number(e.reviewCount)||0,streak:Number(e.streak)||0,last_review:e.lastReview?new Date(e.lastReview).toISOString():null,next_review:e.nextReview?new Date(e.nextReview).toISOString():null,created_at:e.created?new Date(e.created).toISOString():new Date().toISOString()}}
    function fromDb(r){return{id:r.id,term:r.term,meaning:r.meaning||'',exampleEn:r.example_en||'',exampleJa:r.example_ja||'',noteEn:r.note_en||'',noteJa:r.note_ja||'',reviewCount:Number(r.review_count)||0,streak:Number(r.streak)||0,lastReview:r.last_review?new Date(r.last_review).getTime():null,nextReview:r.next_review?new Date(r.next_review).getTime():null,created:r.created_at?new Date(r.created_at).getTime():Date.now()}}
